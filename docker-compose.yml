name: instagestor

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instagestor}
      POSTGRES_USER: ${POSTGRES_USER:-instagestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-instagestor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-instagestor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
      S3_BUCKET: ${S3_BUCKET:-instagestor-media}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"

  web:
    image: instagestor-web:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-instagestor}:${POSTGRES_PASSWORD:-local-postgres-password-change-me}@postgres:5432/${POSTGRES_DB:-instagestor}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-production}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      INSTAGRAM_PROVIDER: ${INSTAGRAM_PROVIDER:-fake}
      ALLOW_FAKE_PROVIDER_IN_PRODUCTION: ${ALLOW_FAKE_PROVIDER_IN_PRODUCTION:-false}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-http://localhost:3000/api/instagram/oauth/callback}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-uploads}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-instagestor-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-instagestor}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MAX_PUBLICATION_ATTEMPTS: ${MAX_PUBLICATION_ATTEMPTS:-5}
      META_GLOBAL_CONCURRENCY: ${META_GLOBAL_CONCURRENCY:-4}
      META_ACCOUNT_CONCURRENCY: ${META_ACCOUNT_CONCURRENCY:-1}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      JOB_LOCK_SECONDS: ${JOB_LOCK_SECONDS:-180}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
      META_HTTP_TIMEOUT_MS: ${META_HTTP_TIMEOUT_MS:-30000}
      CONTAINER_POLL_SECONDS: ${CONTAINER_POLL_SECONDS:-60}
      PUBLISHABLE_URL_TTL_SECONDS: ${PUBLISHABLE_URL_TTL_SECONDS:-7200}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-300000000}
      FAKE_PROVIDER_SCENARIO: ${FAKE_PROVIDER_SCENARIO:-success}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-admin-password-change-me}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: instagestor-worker:local
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    stop_grace_period: 4m
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-instagestor}:${POSTGRES_PASSWORD:-local-postgres-password-change-me}@postgres:5432/${POSTGRES_DB:-instagestor}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret-change-before-production}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      INSTAGRAM_PROVIDER: ${INSTAGRAM_PROVIDER:-fake}
      ALLOW_FAKE_PROVIDER_IN_PRODUCTION: ${ALLOW_FAKE_PROVIDER_IN_PRODUCTION:-false}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-http://localhost:3000/api/instagram/oauth/callback}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-uploads}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-instagestor-media}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-instagestor}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password-change-me}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MAX_PUBLICATION_ATTEMPTS: ${MAX_PUBLICATION_ATTEMPTS:-5}
      META_GLOBAL_CONCURRENCY: ${META_GLOBAL_CONCURRENCY:-4}
      META_ACCOUNT_CONCURRENCY: ${META_ACCOUNT_CONCURRENCY:-1}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      JOB_LOCK_SECONDS: ${JOB_LOCK_SECONDS:-180}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-5000}
      META_HTTP_TIMEOUT_MS: ${META_HTTP_TIMEOUT_MS:-30000}
      CONTAINER_POLL_SECONDS: ${CONTAINER_POLL_SECONDS:-60}
      PUBLISHABLE_URL_TTL_SECONDS: ${PUBLISHABLE_URL_TTL_SECONDS:-7200}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-300000000}
      FAKE_PROVIDER_SCENARIO: ${FAKE_PROVIDER_SCENARIO:-success}
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  minio-data:
